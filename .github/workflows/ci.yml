name: CI

# Manual only. GitHub Actions is not available on the maintainer's account, so this cannot run
# on the main repository: checks are run locally instead (npm run check, node scripts/audit.mjs).
# In a fork with Actions enabled, start it from the Actions tab, or add push and pull_request
# triggers back.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke test the desktop app
        run: node apps/desktop/dist/deleted-text-recovery.cjs --cli --days 1 --top 3

  audit:
    name: No secrets or real data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/audit.mjs
