    <!-- footer -->
    <text x="640" y="598" text-anchor="middle" font-size="21" font-weight="600" fill="#475569"><tspan font-weight="700" fill="#0F172A">Deleted Text Recovery</tspan> &#183; free &#183; no ads &#183; offline</text>
  </g>
