<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="sp-title sp-desc">
  <title id="sp-title">The 5 stages of losing what you just typed</title>
  <desc id="sp-desc">Five cards in a row. 1 Denial: Ctrl+Z, Ctrl+Z, CTRL+Z. 2 Anger: a keyboard with keys flying off. 3 Bargaining: I'll save drafts forever, I swear. 4 Googling: a search box reading recover deleted text pls. 5 This repo: Zee the Text Retriever holding your text, saying Oh, it's right here. Deleted Text Recovery: free, no ads, offline.</desc>
  <defs>
    <pattern id="sp-rule" width="1280" height="48" patternUnits="userSpaceOnUse" patternTransform="translate(0 -18)">
      <rect y="46" width="1280" height="2" fill="#FFD27A" fill-opacity="0.45"/>
    </pattern>
    <clipPath id="sp-pop">
      <circle cx="144" cy="228" r="124"/>
      <rect x="0" y="72" width="288" height="156"/>
    </clipPath>
    <clipPath id="zee-body-clip">
      <path d="M200 312H312C392 330 432 410 432 470C432 492 416 504 396 504H116C96 504 80 492 80 470C80 410 120 330 200 312Z"/>
    </clipPath>
  </defs>

  <!-- paper background -->
  <rect width="1280" height="640" fill="#FFF8EB"/>
  <rect width="1280" height="640" fill="url(#sp-rule)"/>

  <g font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
    <!-- header -->
    <text x="640" y="68" text-anchor="middle" font-size="50" font-weight="700" letter-spacing="-0.5" textLength="969" lengthAdjust="spacingAndGlyphs" fill="#0F172A">The <tspan fill="#FF6B35">5 stages</tspan> of losing what you just typed</text>

    <!-- 1 DENIAL -->
    <g transform="translate(40 116)">
      <rect x="7" y="9" width="212" height="432" rx="22" fill="#FFD27A"/>
      <rect width="212" height="432" rx="22" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
      <circle cx="16" cy="12" r="20" fill="#0F172A"/>
      <text x="16" y="20" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">1</text>
      <text x="106" y="60" text-anchor="middle" font-size="21" font-weight="700" letter-spacing="2.5" fill="#0F172A">DENIAL</text>
      <rect x="88" y="72" width="36" height="5" rx="2.5" fill="#FF6B35"/>
      <!-- undo arrow -->
      <g fill="none" stroke="#475569" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M108 134C108 102 66 92 42 114"/>
        <path d="M64 110L42 114L49 93"/>
      </g>
      <!-- press counter -->
      <rect x="130" y="98" width="66" height="32" rx="16" fill="#FF6B35"/>
      <text x="163" y="121" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">&#215;47</text>
      <!-- keys -->
      <rect x="16" y="160" width="98" height="78" rx="15" fill="#475569"/>
      <rect x="16" y="150" width="98" height="78" rx="15" fill="#FFF8EB" stroke="#0F172A" stroke-width="3"/>
      <text x="65" y="198" text-anchor="middle" font-size="25" font-weight="700" fill="#0F172A">Ctrl</text>
      <rect x="124" y="160" width="72" height="78" rx="15" fill="#D4831A"/>
      <rect x="124" y="155" width="72" height="78" rx="15" fill="#FFD27A" stroke="#0F172A" stroke-width="3"/>
      <text x="160" y="206" text-anchor="middle" font-size="34" font-weight="700" fill="#0F172A">Z</text>
      <g fill="none" stroke="#FF6B35" stroke-width="5" stroke-linecap="round">
        <path d="M160 146V136"/>
        <path d="M140 147L134 139"/>
        <path d="M180 147L186 139"/>
      </g>
      <!-- caption -->
      <g font-family="ui-monospace, Consolas, monospace" text-anchor="middle">
        <text x="106" y="290" font-size="18" font-weight="600" fill="#475569">Ctrl+Z.</text>
        <text x="106" y="326" font-size="25" font-weight="700" fill="#0F172A">Ctrl+Z.</text>
        <text x="106" y="382" font-size="38" font-weight="700" fill="#FF6B35">CTRL+Z.</text>
      </g>
    </g>

    <!-- 2 ANGER -->
    <g transform="translate(268 116)">
      <rect x="7" y="9" width="212" height="432" rx="22" fill="#FFD27A"/>
      <rect width="212" height="432" rx="22" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
      <circle cx="16" cy="12" r="20" fill="#0F172A"/>
      <text x="16" y="20" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">2</text>
      <text x="106" y="60" text-anchor="middle" font-size="21" font-weight="700" letter-spacing="2.5" fill="#0F172A">ANGER</text>
      <rect x="88" y="72" width="36" height="5" rx="2.5" fill="#FF6B35"/>
      <!-- impact burst -->
      <path d="M196 214L172.6 230.7L178.8 261L147.1 257.7L133.8 290L106 268L78.2 290L64.9 257.7L33.2 261L39.4 230.7L16 214L39.4 197.3L33.2 167L64.9 170.3L78.2 138L106 160L133.8 138L147.1 170.3L178.8 167L172.6 197.3Z" fill="#FFD27A" stroke="#FFD27A" stroke-width="5" stroke-linejoin="round"/>
      <!-- keyboard -->
      <g transform="rotate(-8 106 218)">
        <rect x="16" y="184" width="180" height="92" rx="14" fill="#475569"/>
        <rect x="16" y="176" width="180" height="92" rx="14" fill="#1E293B"/>
        <g fill="#FFF8EB">
          <rect x="30" y="188" width="22" height="18" rx="5"/>
          <rect x="56" y="188" width="22" height="18" rx="5"/>
          <rect x="108" y="188" width="22" height="18" rx="5"/>
          <rect x="160" y="188" width="22" height="18" rx="5"/>
          <rect x="30" y="212" width="22" height="18" rx="5"/>
          <rect x="82" y="212" width="22" height="18" rx="5"/>
          <rect x="108" y="212" width="22" height="18" rx="5"/>
          <rect x="134" y="212" width="22" height="18" rx="5"/>
          <rect x="160" y="212" width="22" height="18" rx="5"/>
          <rect x="30" y="236" width="22" height="18" rx="5"/>
          <rect x="56" y="236" width="100" height="18" rx="5"/>
          <rect x="160" y="236" width="22" height="18" rx="5"/>
        </g>
        <g fill="#0F172A">
          <rect x="82" y="188" width="22" height="18" rx="5"/>
          <rect x="134" y="188" width="22" height="18" rx="5"/>
          <rect x="56" y="212" width="22" height="18" rx="5"/>
        </g>
      </g>
      <!-- flying keys -->
      <g fill="#FFF8EB" stroke="#0F172A" stroke-width="3" stroke-linejoin="round">
        <rect x="-15" y="-13" width="30" height="26" rx="7" transform="translate(48 128) rotate(-24)"/>
        <rect x="-15" y="-13" width="30" height="26" rx="7" transform="translate(110 106) rotate(14)"/>
        <rect x="-15" y="-13" width="30" height="26" rx="7" transform="translate(170 130) rotate(32)"/>
      </g>
      <g fill="none" stroke="#FF6B35" stroke-width="5" stroke-linecap="round">
