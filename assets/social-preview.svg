      <path d="M0-12Q2-2 12 0Q2 2 0 12Q-2 2-12 0Q-2-2 0-12Z" transform="translate(262 322) scale(0.7)" fill="#FF6B35"/>
      <g text-anchor="middle" fill="#14B8A6">
