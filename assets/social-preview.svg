        <path d="M76 156L72 147"/>
        <path d="M104 142L105 130"/>
        <path d="M118 143L120 132"/>
        <path d="M150 152L156 143"/>
        <path d="M164 160L169 152"/>
      </g>
      <!-- caption -->
      <text x="106" y="386" text-anchor="middle" font-size="76" font-weight="700" letter-spacing="6" fill="#FF6B35">!!!</text>
    </g>

    <!-- 3 BARGAINING -->
    <g transform="translate(496 116)">
      <rect x="7" y="9" width="212" height="432" rx="22" fill="#FFD27A"/>
      <rect width="212" height="432" rx="22" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
      <circle cx="16" cy="12" r="20" fill="#0F172A"/>
      <text x="16" y="20" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">3</text>
      <text x="106" y="60" text-anchor="middle" font-size="21" font-weight="700" letter-spacing="2.5" fill="#0F172A">BARGAINING</text>
      <rect x="88" y="72" width="36" height="5" rx="2.5" fill="#FF6B35"/>
      <!-- halo -->
      <ellipse cx="106" cy="112" rx="46" ry="12" fill="none" stroke="#F5A623" stroke-width="8"/>
      <!-- floppy disk -->
      <path d="M60 140H140L164 164V244Q164 256 152 256H60Q48 256 48 244V152Q48 140 60 140Z" fill="#1E293B"/>
      <rect x="72" y="140" width="56" height="38" rx="4" fill="#475569"/>
      <rect x="104" y="147" width="13" height="24" rx="3" fill="#FFF8EB"/>
      <rect x="64" y="196" width="84" height="52" rx="6" fill="#FFF8EB"/>
      <g fill="none" stroke="#475569" stroke-opacity="0.6" stroke-width="5" stroke-linecap="round">
        <path d="M76 210H136"/>
        <path d="M76 222H124"/>
        <path d="M76 234H130"/>
      </g>
      <path d="M0-12Q2-2 12 0Q2 2 0 12Q-2 2-12 0Q-2-2 0-12Z" transform="translate(30 156) scale(1.1)" fill="#F5A623"/>
      <path d="M0-12Q2-2 12 0Q2 2 0 12Q-2 2-12 0Q-2-2 0-12Z" transform="translate(184 138) scale(0.8)" fill="#FF6B35"/>
      <path d="M0-12Q2-2 12 0Q2 2 0 12Q-2 2-12 0Q-2-2 0-12Z" transform="translate(180 236) scale(0.6)" fill="#F5A623"/>
      <!-- caption -->
      <g text-anchor="middle">
        <text x="106" y="304" font-size="21" font-weight="600" fill="#0F172A">I'll save drafts</text>
        <text x="106" y="332" font-size="21" font-weight="600" fill="#0F172A">forever.</text>
        <text x="106" y="382" font-size="31" font-weight="700" font-style="italic" fill="#FF6B35">I swear.</text>
      </g>
    </g>

    <!-- 4 GOOGLING -->
    <g transform="translate(724 116)">
      <rect x="7" y="9" width="212" height="432" rx="22" fill="#FFD27A"/>
      <rect width="212" height="432" rx="22" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
      <circle cx="16" cy="12" r="20" fill="#0F172A"/>
      <text x="16" y="20" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">4</text>
      <text x="106" y="60" text-anchor="middle" font-size="21" font-weight="700" letter-spacing="2.5" fill="#0F172A">GOOGLING</text>
      <rect x="88" y="72" width="36" height="5" rx="2.5" fill="#FF6B35"/>
      <!-- worried magnifier -->
      <path d="M122 172L156 206" fill="none" stroke="#0F172A" stroke-width="14" stroke-linecap="round"/>
      <circle cx="92" cy="142" r="40" fill="#FFF8EB" stroke="#0F172A" stroke-width="9"/>
      <circle cx="79" cy="138" r="4.5" fill="#0F172A"/>
      <circle cx="105" cy="138" r="4.5" fill="#0F172A"/>
      <g fill="none" stroke="#0F172A" stroke-width="3.5" stroke-linecap="round">
        <path d="M69 127L84 121"/>
        <path d="M100 121L115 127"/>
        <path d="M78 158Q85 151 92 158T106 158" stroke-width="4"/>
      </g>
      <path d="M150 98C156 108 159 113 159 118A9 9 0 0 1 141 118C141 113 144 108 150 98Z" fill="#14B8A6"/>
      <!-- search box -->
      <rect x="14" y="228" width="184" height="88" rx="20" fill="#FFF8EB" stroke="#0F172A" stroke-width="3"/>
      <g fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round">
        <circle cx="36" cy="254" r="7"/>
        <path d="M41 259L47 265"/>
      </g>
      <text x="56" y="262" font-size="18" font-weight="600" textLength="127" lengthAdjust="spacingAndGlyphs" fill="#0F172A">recover deleted</text>
      <text x="56" y="290" font-size="18" font-weight="600" fill="#0F172A">text pls<tspan fill="#FF6B35" font-weight="400">|</tspan></text>
      <!-- results -->
      <text x="106" y="354" text-anchor="middle" font-size="17" font-weight="600" fill="#475569">0 helpful results</text>
      <g fill="none" stroke="#475569" stroke-opacity="0.2" stroke-width="8" stroke-linecap="round">
        <path d="M40 378H172"/>
        <path d="M40 398H138"/>
      </g>
    </g>

    <!-- 5 THIS REPO (hero) -->
    <g transform="translate(952 98)">
      <rect x="9" y="11" width="288" height="470" rx="26" fill="#D4831A"/>
      <rect width="288" height="470" rx="26" fill="#0F172A" stroke="#F5A623" stroke-width="5"/>
      <circle cx="18" cy="14" r="22" fill="#F5A623" stroke="#0F172A" stroke-width="3"/>
      <text x="18" y="23" text-anchor="middle" font-size="24" font-weight="700" fill="#0F172A">5</text>
      <text x="144" y="58" text-anchor="middle" font-size="23" font-weight="700" letter-spacing="2.5" fill="#F5A623">THIS REPO</text>
      <rect x="124" y="69" width="40" height="5" rx="2.5" fill="#14B8A6"/>
      <circle cx="144" cy="228" r="124" fill="#1E293B"/>
      <g clip-path="url(#sp-pop)">
        <g transform="translate(-10 72) scale(0.6)">
          <g transform="translate(0 -26)">
            <path d="M200 312H312C392 330 432 410 432 470C432 492 416 504 396 504H116C96 504 80 492 80 470C80 410 120 330 200 312Z" fill="#F5A623"/>
            <ellipse cx="256" cy="320" rx="150" ry="30" fill="#D4831A" fill-opacity="0.34" clip-path="url(#zee-body-clip)"/>
            <path d="M238 76C242 60 252 50 264 46C262 56 266 63 275 58C275 66 278 72 282 78Z" fill="#F5A623"/>
            <ellipse cx="256" cy="190" rx="128" ry="120" fill="#F5A623"/>
            <path d="M178 86C158 70 122 76 106 108C88 146 82 222 96 266C104 290 128 294 140 272C154 246 152 196 160 150C164 128 170 104 178 86Z" fill="#D4831A"/>
            <path d="M334 86C354 70 390 76 406 108C424 146 430 222 416 266C408 290 384 294 372 272C358 246 360 196 352 150C348 128 342 104 334 86Z" fill="#D4831A"/>
            <g transform="rotate(-5 256 300)">
              <path d="M180 290L334 286L340 356L335 434L310 462L186 458L177 380Z" transform="translate(8 9)" fill="#D4831A" stroke="#D4831A" stroke-width="8" stroke-linejoin="round"/>
              <path d="M180 290L334 286L340 356L335 434L310 462L186 458L177 380Z" fill="#FFF8EB" stroke="#FFF8EB" stroke-width="8" stroke-linejoin="round"/>
              <path d="M339 432L310 436L308 465Z" fill="#FFD27A" stroke="#FFD27A" stroke-width="4" stroke-linejoin="round"/>
              <g fill="none" stroke="#475569" stroke-opacity="0.22" stroke-width="3" stroke-linecap="round">
                <path d="M178 404L192 416"/>
                <path d="M232 460L240 448"/>
              </g>
              <g fill="none" stroke="#475569" stroke-opacity="0.62" stroke-width="10" stroke-linecap="round">
                <path d="M200 340H314"/>
                <path d="M200 366H296"/>
                <path d="M200 418H282"/>
                <path d="M200 444H262"/>
              </g>
              <path d="M200 392H318" fill="none" stroke="#14B8A6" stroke-width="10" stroke-linecap="round"/>
            </g>
            <circle cx="176" cy="238" r="14" fill="#FF6B35" fill-opacity="0.24"/>
            <circle cx="336" cy="238" r="14" fill="#FF6B35" fill-opacity="0.24"/>
            <path d="M256 212C292 212 326 234 326 270C326 298 308 314 288 314C272 314 260 306 256 294C252 306 240 314 224 314C204 314 186 298 186 270C186 234 220 212 256 212Z" fill="#FFD27A"/>
            <path d="M306 304C300 311 294 314 288 314C272 314 260 306 256 294C252 306 240 314 224 314C218 314 212 311 206 304" fill="none" stroke="#0F172A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M256 254V294" fill="none" stroke="#0F172A" stroke-width="6" stroke-linecap="round"/>
            <path d="M226 229C226 220 240 217 256 217C272 217 286 220 286 229C286 245 268 258 256 258C244 258 226 245 226 229Z" fill="#0F172A"/>
            <ellipse cx="245" cy="227" rx="9" ry="4" fill="#FFFFFF" fill-opacity="0.3"/>
            <ellipse cx="204" cy="178" rx="18" ry="22" fill="#0F172A"/>
            <ellipse cx="308" cy="178" rx="18" ry="22" fill="#0F172A"/>
            <circle cx="198" cy="169" r="7" fill="#FFFFFF"/>
            <circle cx="302" cy="169" r="7" fill="#FFFFFF"/>
            <circle cx="210" cy="187" r="3" fill="#FFFFFF"/>
            <circle cx="314" cy="187" r="3" fill="#FFFFFF"/>
            <path d="M181 142Q198 130 217 137" fill="none" stroke="#D4831A" stroke-width="7" stroke-linecap="round"/>
            <path d="M331 142Q314 130 295 137" fill="none" stroke="#D4831A" stroke-width="7" stroke-linecap="round"/>
