  <!-- title block -->
  <g font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
    <text x="456" y="158" font-size="70" font-weight="700" letter-spacing="-1" textLength="713" lengthAdjust="spacingAndGlyphs" fill="#FFFFFF">Deleted <tspan fill="#F5A623">Text</tspan> Recovery</text>
    <text x="458" y="218" font-size="34" font-weight="600" textLength="436" lengthAdjust="spacingAndGlyphs" fill="#FFF8EB">Typed it. Lost it. <tspan fill="#14B8A6" font-weight="700">Get it back.</tspan></text>
    <g font-size="19" font-weight="700" letter-spacing="1.5" text-anchor="middle" fill="#0F172A">
      <rect x="458" y="254" width="104" height="46" rx="23" fill="#F5A623"/>
      <text x="510" y="284">FREE</text>
      <rect x="576" y="254" width="132" height="46" rx="23" fill="#FF6B35"/>
      <text x="642" y="284">NO ADS</text>
      <rect x="722" y="254" width="208" height="46" rx="23" fill="#14B8A6"/>
