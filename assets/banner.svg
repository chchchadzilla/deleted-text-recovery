        <ellipse cx="256" cy="190" rx="128" ry="120" fill="#F5A623"/>
        <path d="M178 86C158 70 122 76 106 108C88 146 82 222 96 266C104 290 128 294 140 272C154 246 152 196 160 150C164 128 170 104 178 86Z" fill="#D4831A"/>
