<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">Deleted Text Recovery</title>
  <desc id="banner-desc">Typed it. Lost it. Get it back. Free, no ads, 100% offline. With Zee the Text Retriever, a golden retriever holding a recovered sheet of text.</desc>
  <defs>
    <clipPath id="banner-clip"><rect width="1280" height="420" rx="32"/></clipPath>
    <pattern id="banner-keys" width="72" height="144" patternUnits="userSpaceOnUse" patternTransform="translate(-14 -30)">
      <rect x="6" y="6" width="60" height="60" rx="13" fill="none" stroke="#1E293B" stroke-width="2.5"/>
      <rect x="-30" y="78" width="60" height="60" rx="13" fill="none" stroke="#1E293B" stroke-width="2.5"/>
      <rect x="42" y="78" width="60" height="60" rx="13" fill="none" stroke="#1E293B" stroke-width="2.5"/>
    </pattern>
    <clipPath id="banner-pop">
      <circle cx="214" cy="196" r="152"/>
      <rect x="0" y="0" width="430" height="196"/>
    </clipPath>
    <clipPath id="zee-body-clip">
      <path d="M200 312H312C392 330 432 410 432 470C432 492 416 504 396 504H116C96 504 80 492 80 470C80 410 120 330 200 312Z"/>
    </clipPath>
  </defs>

